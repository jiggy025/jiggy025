<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="100%" height="180">
  <defs>
    <style>
      .bg { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; }
      .grid { stroke: #e2e8f0; stroke-width: 0.5; opacity: 0.4; }
      .pill-bg { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1; }
      .pill-text { fill: #1d4ed8; font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; }
      .title { fill: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 32px; font-weight: 700; letter-spacing: -0.03em; }
      .dot { fill: #2563eb; }
      .subtitle { fill: #475569; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 400; line-height: 1.5; }
      .accent-line { stroke: #2563eb; stroke-width: 3; stroke-linecap: round; }

      @media (prefers-color-scheme: dark) {
        .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; }
        .grid { stroke: #21262d; stroke-width: 0.5; opacity: 0.6; }
        .pill-bg { fill: rgba(56, 189, 248, 0.1); stroke: rgba(56, 189, 248, 0.3); }
        .pill-text { fill: #38bdf8; }
        .title { fill: #f0f6fc; }
        .dot { fill: #38bdf8; }
        .subtitle { fill: #8b949e; }
        .accent-line { stroke: #38bdf8; }
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect class="bg" x="1" y="1" width="878" height="178" rx="12" />

  <!-- Subtle Blueprint Grid Accent -->
  <g class="grid">
    <line x1="40" y1="0" x2="40" y2="180" />
    <line x1="840" y1="0" x2="840" y2="180" />
    <line x1="0" y1="36" x2="880" y2="36" />
    <line x1="0" y1="144" x2="880" y2="144" />
  </g>

  <!-- Accent Vertical Pill Marker -->
  <line class="accent-line" x1="40" y1="52" x2="40" y2="128" />

  <!-- Role Badge -->
  <g transform="translate(56, 36)">
    <rect class="pill-bg" x="0" y="0" width="550" height="24" rx="12" />
    <circle class="dot" cx="12" cy="12" r="3.5" />
    <text class="pill-text" x="24" y="16">ASSOCIATE SOFTWARE DEVELOPER · ENTERPRISE JAVA &amp; OFFLINE-FIRST SYSTEMS</text>
  </g>

  <!-- Name / Title -->
  <text class="title" x="56" y="98">Jiggy B. Palconit</text>

  <!-- Subtitle Narrative -->
  <text class="subtitle" x="56" y="130">Building resilient enterprise ERP bridges, offline-first mobile architectures, and sub-5ms event systems.</text>
</svg>