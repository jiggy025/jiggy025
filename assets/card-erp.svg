<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 140" width="100%" height="140">
  <defs>
    <style>
      .bg { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; }
      .tag { fill: #0284c7; font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.08em; }
      .title { fill: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 700; }
      .item { fill: #334155; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; }
      .pill { fill: #f0f9ff; stroke: #bae6fd; stroke-width: 1; }
      .accent { fill: #0284c7; }

      @media (prefers-color-scheme: dark) {
        .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; }
        .tag { fill: #38bdf8; }
        .title { fill: #f0f6fc; }
        .item { fill: #94a3b8; }
        .pill { fill: rgba(56, 189, 248, 0.1); stroke: rgba(56, 189, 248, 0.3); }
        .accent { fill: #38bdf8; }
      }
    </style>
  </defs>

  <rect class="bg" x="1" y="1" width="418" height="138" rx="10" />

  <!-- Tag Pill -->
  <g transform="translate(20, 18)">
    <rect class="pill" x="0" y="0" width="180" height="20" rx="10" />
    <circle class="accent" cx="10" cy="10" r="3" />
    <text class="tag" x="18" y="13.5">ENTERPRISE ERP &amp; JRF</text>
  </g>

  <!-- Title -->
  <text class="title" x="20" y="60">Enterprise ERP &amp; JRF Bridge</text>

  <!-- Highlights -->
  <text class="item" x="20" y="84"><tspan class="accent">•</tspan> Java 17 + Spring Boot 3.3 to Java 7/8 ERP</text>
  <text class="item" x="20" y="103"><tspan class="accent">•</tspan> @Version Concurrency · Zero race conditions</text>
  <text class="item" x="20" y="122"><tspan class="accent">•</tspan> AutoCloseable EDT isolation &amp; ROQ engine</text>
</svg>