<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 145" width="100%" height="145">
  <defs>
    <style>
      .bg { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; }
      .tag { fill: #16a34a; font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; }
      .title { fill: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 700; }
      .item { fill: #334155; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; }
      .pill { fill: #f0fdf4; stroke: #bbf7d0; stroke-width: 1; }
      .accent { fill: #16a34a; }

      @media (prefers-color-scheme: dark) {
        .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; }
        .tag { fill: #4ade80; }
        .title { fill: #f0f6fc; }
        .item { fill: #94a3b8; }
        .pill { fill: rgba(74, 222, 128, 0.1); stroke: rgba(74, 222, 128, 0.3); }
        .accent { fill: #4ade80; }
      }
    </style>
  </defs>

  <rect class="bg" x="1" y="1" width="418" height="143" rx="10" />

  <!-- Tag Pill -->
  <g transform="translate(20, 16)">
    <rect class="pill" x="0" y="0" width="190" height="22" rx="11" />
    <circle class="accent" cx="11" cy="11" r="3.5" />
    <text class="tag" x="20" y="15">LOCAL-FIRST MOBILE</text>
  </g>

  <!-- Title -->
  <text class="title" x="20" y="62">Offline-First Retail Ledger</text>

  <!-- Highlights -->
  <text class="item" x="20" y="88"><tspan class="accent">•</tspan> Flutter, Dart, SQLite, BLoC Architecture</text>
  <text class="item" x="20" y="108"><tspan class="accent">•</tspan> 53 Passing Tests (automated test suite)</text>
  <text class="item" x="20" y="128"><tspan class="accent">•</tspan> Real-time vacancy audit &amp; seller payouts</text>
</svg>